<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff8a3d">
<title>איפה ההפתעה? – זומי בומי</title>
<link rel="icon" href="../lib/assets/img/zumi_face.webp">
<link rel="stylesheet" href="../lib/zb.css">
<style>
#app{background:radial-gradient(ellipse at 50% 20%,#fff1b8 0%,#ffb86b 45%,#ff6f91 100%)}
#bunting{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 50px);left:0;right:0;height:30px;background:repeating-linear-gradient(90deg,transparent 0 4px,transparent 4px 40px);z-index:1;display:flex;justify-content:space-around}
#bunting i{width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid #ff4fa8}
#bunting i:nth-child(3n+1){border-top-color:#3fb8ff}#bunting i:nth-child(3n+2){border-top-color:#ffd23f}
.char{position:absolute;top:13%;height:30%;background-repeat:no-repeat;z-index:2;filter:drop-shadow(0 6px 5px rgba(0,0,0,.25))}
#zu{left:50%;transform:translateX(-50%)}
#ef{right:2%;height:26%;top:16%}
#table{position:absolute;left:3%;right:3%;top:41%;height:40%;z-index:3}
#tableTop{position:absolute;left:0;right:0;top:20%;bottom:0;background:linear-gradient(#9b5de5,#7b2ff2);border-radius:30px 30px 18px 18px;box-shadow:0 10px 0 #4b148f,inset 0 8px 0 rgba(255,255,255,.25)}
#tableTop::after{content:'';position:absolute;inset:10px;border-radius:24px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 16px,transparent 16px 32px)}
.box{position:absolute;width:var(--bw);height:var(--bw);transition:left var(--sd) ease-in-out,top var(--sd) ease-in-out,transform .35s cubic-bezier(.3,1.6,.5,1);z-index:5;cursor:pointer;touch-action:manipulation}
.box .body{position:absolute;left:4%;right:4%;top:24%;bottom:0;border-radius:12%;background:var(--c);box-shadow:inset 0 -10px 0 rgba(0,0,0,.18),0 6px 0 rgba(0,0,0,.25)}
.box .lid{position:absolute;left:0;right:0;top:12%;height:20%;border-radius:10px;background:var(--c);filter:brightness(1.12);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.box .rib{position:absolute;left:44%;width:12%;top:12%;bottom:0;background:var(--r)}
.box .bow{position:absolute;left:50%;top:0;width:56%;height:22%;transform:translateX(-50%)}
.box .bow::before,.box .bow::after{content:'';position:absolute;top:10%;width:46%;height:80%;background:var(--r);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.box .bow::before{left:0;transform:rotate(-20deg)}.box .bow::after{right:0;transform:rotate(20deg)}
.box .num{position:absolute;left:0;right:0;top:48%;text-align:center;font-weight:900;color:rgba(255,255,255,.9);font-size:calc(var(--bw)*.28);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.box.up{transform:translateY(-62%) rotate(-6deg)}
.box.wiggle{animation:wig .4s ease-in-out 2}
@keyframes wig{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.box.glow .body{box-shadow:0 0 0 5px #fff,0 0 26px 8px #ffe36b}
#prize{position:absolute;width:var(--bw);height:var(--bw);display:flex;align-items:flex-end;justify-content:center;font-size:calc(var(--bw)*.6);z-index:4;transition:left .45s ease-in-out,top .45s ease-in-out,opacity .2s;pointer-events:none;line-height:1}
#prize.hop{transition:left .5s cubic-bezier(.4,0,.6,1),top .25s ease-out;z-index:9}
#hud{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 54px);right:12px;left:12px;display:flex;justify-content:space-between;z-index:6;pointer-events:none}
#msg{position:absolute;left:0;right:0;top:84%;text-align:center;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 4px rgba(120,20,80,.6);z-index:6;pointer-events:none}
#eyes{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(0);font-size:70px;z-index:12;transition:transform .25s;pointer-events:none}
#eyes.on{transform:translate(-50%,-50%) scale(1)}
.screen{z-index:20}
</style>
</head>
<body>
<div id="app">
  <div id="bunting"></div>
  <div class="char" id="zu"></div><div class="char" id="ef"></div>
  <div id="hud"><div class="pill" id="hRound">🎁 1/5</div><div class="pill" id="hScore">✅ 0</div></div>
  <div id="table"><div id="tableTop"></div><div id="prize">🌟</div></div>
  <div id="msg"></div>
  <div id="eyes">👀</div>
  <section id="scrStart" class="screen show">
    <div class="panel" style="margin-top:auto;margin-bottom:auto">
      <div class="logo"><span class="l1">איפה ההפתעה?</span><span class="l2">🎁 עם זומי בומי 🎁</span></div>
      <p class="sub">זומי מחביא הפתעה בקופסה ומערבב. עקבו טוב! וזהירות – זומי לפעמים מרמה… 😜</p>
      <button class="btn big pink pulse" id="go">👀 מתחילים!</button>
    </div>
  </section>
  <section id="scrEnd" class="screen panelscr">
    <div class="panel">
      <div class="big-emoji" id="endEmoji">🎁</div>
      <h2 id="endTitle">כל הכבוד!</h2>
      <p class="sub" id="endSub"></p>
      <div class="starsWon" id="endStars">+0 ⭐</div>
      <button class="btn big pink pulse" id="again">🔁 עוד משחק!</button>
      <a class="btn mid gray" href="../hub/">🏠 לכל המשחקים</a>
    </div>
  </section>
</div>
<script src="../lib/voices.js"></script>
<script src="../lib/zb.js"></script>
<script src="surprise.js"></script>
</body>
</html>
